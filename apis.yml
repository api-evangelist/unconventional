aid: unconventional
name: Unconventional
description: Unconventional (Unconventional, Inc.) is an AI-hardware research company rethinking the foundations
  of the computer to optimize energy efficiency for AI. Founded by experts in AI systems, analog circuits,
  computing theory, and neuroscience, and backed by Playground Global, the company researches dynamical-systems
  computing substrates — coupled-oscillator (Kuramoto) hardware, an instruction set architecture for dynamical-system
  hardware, and hardware/software neural co-evolution — targeting biology-scale energy efficiency. Its
  open-source Un-0 model generates images with simulated coupled oscillators. Unconventional does not
  currently publish a public API, developer portal, or hosted product.
